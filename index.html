<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes it size correctly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Squeaker</title>

    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Squeaker">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 24px;

            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        button {
            width: 100%;
            min-height: 180px;

            border: none;
            border-radius: 25px;

            font-size: 32px;
            font-weight: bold;

            cursor: pointer;

            /* Makes button taps feel better on phones */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #squeak1 {
            background: #ffcc00;
            color: #111;
        }

        #squeak2 {
            background: #00c8ff;
            color: #111;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <div class="container">
        <button id="squeak1" onclick="playSound('sound1')">
            🐶 SQUEAK
        </button>

        <button id="squeak2" onclick="playSound('sound2')">
            🐶 CHICKEN
        </button>
    </div>

    <!-- WAV files in the same folder as index.html -->
    <audio id="sound1" src="Squeek.wav" preload="auto"></audio>
    <audio id="sound2" src="chicken.wav" preload="auto"></audio>

    <script>
        function playSound(id) {
            const sound = document.getElementById(id);

            // Restart the sound immediately if the button
            // is pressed again before it finishes.
            sound.currentTime = 0;
            sound.play();
        }
    </script>

</body>
</html>
